/* Ambient practice scenes, ported from the SNB app player. One engine for every
   practice, drawn on a canvas that survives slide changes. */
const SCENE_LIST=['circles','drift','pond','reeds','breeze','sunbeam','fireflies'];
const SCENE_DARK={sunbeam:1,fireflies:1};
const SCENE_CAP={
  '':'a different scene each session, chosen at random when you present.',
  circles:'the breathing circle. the original.',
  drift:'motes rising, each at its own speed.',
  pond:'a ripple now and then, then still.',
  reeds:'uneven-wind sway, every strand on its own period.',
  breeze:'straight strands drifting sideways.',
  sunbeam:'warm light on a dark field, dust turning in it.',
  fireflies:'slow blinking on a dark field.'
};
let _sessionScene='circles';
function rollSessionScene(){ _sessionScene=SCENE_LIST[Math.floor(Math.random()*SCENE_LIST.length)]; }
const AMB=(function(){
  const INK=[26,31,42],BONE=[250,249,245];
  const reduce=(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
  let scene='circles',motes=[],reeds=[],rips=[],strands=[],dust=[],flies=[],
      ripNext=0,sT=0,sLast=0,breath=.5,breath2=.5;
  const canvases=[];
  const fieldW=()=>(canvases[0]&&canvases[0].clientWidth)||1280;
  function seed(){
    motes=[];reeds=[];rips=[];strands=[];dust=[];flies=[];ripNext=0;sT=0;sLast=0;
    const RN=reduce?7:Math.round(Math.max(7,Math.min(22,fieldW()/100)));
    for(let i=0;i<RN;i++)reeds.push({x:(i/(RN-1))*.96+.02+(Math.random()-.5)*.028,h:.24+Math.random()*.42,
      per:8+Math.random()*8,ph:Math.random()*6.283,amp:.035+Math.random()*.045,w:1.1+Math.random()*1.5,a:.3+Math.random()*.32});
    const MN=reduce?9:Math.round(Math.max(9,Math.min(20,fieldW()/70)));
    for(let i=0;i<MN;i++)motes.push({x:Math.random(),y:Math.random(),r:1.5+Math.random()*3.5,
      v:(3.5+Math.random()*8)/1000,dx:(Math.random()-.5)*.003,a:.18+Math.random()*.3});
    for(let i=0;i<7;i++)strands.push({y:.15+.7*(i/6)+(Math.random()-.5)*.06,len:.2+Math.random()*.22,
      sp:(28+Math.random()*46)/1000,x:Math.random()*1.4-.2,a:.22+Math.random()*.28});
    for(let i=0;i<8;i++)dust.push({x:.36+Math.random()*.24,y:.12+Math.random()*.72,r:1+Math.random()*1.6,
      per:9+Math.random()*11,ph:Math.random()*6.283,ax:4+Math.random()*6,ay:8+Math.random()*9,a:.35+Math.random()*.25});
    const FN=reduce?7:Math.round(Math.max(7,Math.min(14,fieldW()/100)));
    for(let i=0;i<FN;i++)flies.push({x:.12+.76*(i/(FN-1))+(Math.random()-.5)*.09,y:.15+Math.random()*.62,
      per:5.5+Math.random()*6.5,ph:Math.random()*10,wx:8+Math.random()*9,wy:6+Math.random()*8});
  }
  seed();
  function fit(cv){
    const dpr=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
    if(!w||!h)return null;
    if(Math.round(w*dpr)!==cv.width||Math.round(h*dpr)!==cv.height){cv.width=w*dpr;cv.height=h*dpr;}
    const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);return g;
  }
  function drawOne(cv){
    const g=fit(cv); if(!g)return;
    const W=cv.clientWidth,H=cv.clientHeight; g.clearRect(0,0,W,H);
    const dark=!!SCENE_DARK[scene],base=dark?BONE:INK;
    const col=a=>'rgba('+base[0]+','+base[1]+','+base[2]+','+a+')';
    const unit=Math.min(W*0.82,430,H*0.62);
    if(scene==='circles'){
      const cx=W/2,cy=H/2,dotR=Math.max(2.5,unit*0.02); g.lineCap='round';
      g.strokeStyle=col(0.16);g.lineWidth=1.5;g.beginPath();g.arc(cx,cy,unit*(0.30+0.13*breath2),0,6.283);g.stroke();
      g.strokeStyle=col(0.28);g.lineWidth=2.5;g.beginPath();g.arc(cx,cy,unit*(0.20+0.12*breath),0,6.283);g.stroke();
      g.fillStyle=col(0.30);g.beginPath();g.arc(cx,cy,dotR,0,6.283);g.fill();
    } else if(scene==='drift'){
      motes.forEach(m=>{g.strokeStyle=col(m.a*0.55);g.lineWidth=1.3;
        g.beginPath();g.arc(m.x*W,m.y*H,m.r*(unit/300+.6),0,6.283);g.stroke();});
    } else if(scene==='pond'){
      rips.forEach(rp=>{const age=sT-rp.b,life=6; if(age>life)return;
        const pr=age/life,R=unit*(.06+.42*pr);
        const aOut=(pr<.08?pr/.08:Math.max(0,1-((pr-.08)/.57)))*.42;
        const aIn=(pr<.08?pr/.08:1-((pr-.08)/.92))*.42; g.lineWidth=1.5;
        g.strokeStyle=col(aOut);g.beginPath();g.arc(rp.x*W,rp.y*H,R,0,6.283);g.stroke();
        g.strokeStyle=col(aIn); g.beginPath();g.arc(rp.x*W,rp.y*H,R*.62,0,6.283);g.stroke();});
    } else if(scene==='reeds'){
      reeds.forEach(rd=>{const sw=Math.sin(sT*6.283/rd.per+rd.ph)*rd.amp;
        const bx=rd.x*W,by=H,hh=rd.h*H,tx=bx+sw*hh,ty=by-hh;
        g.strokeStyle=col((rd.a!=null?rd.a:.5)*0.62);g.lineWidth=rd.w;g.lineCap='round';
        g.beginPath();g.moveTo(bx,by);g.quadraticCurveTo(bx+sw*hh*.25,by-hh*.55,tx,ty);g.stroke();});
    } else if(scene==='breeze'){
      strands.forEach(s2=>{const y0=s2.y*H,x0=s2.x*W,L=s2.len*W;
        g.strokeStyle=col(s2.a*0.55);g.lineWidth=1.6;g.lineCap='round';
        g.beginPath();g.moveTo(x0,y0);g.lineTo(x0+L,y0);g.stroke();});
    } else if(scene==='sunbeam'){
      const A=a=>'rgba(246,228,180,'+a+')';
      const bw=W*.34,grd=g.createLinearGradient(0,-H,0,H);
      grd.addColorStop(0,A(.30));grd.addColorStop(1,A(.04));
      g.save();g.translate(W*.5,H*.5);g.rotate(.3);g.fillStyle=grd;g.fillRect(-bw/2,-H*1.2,bw,H*2.4);g.restore();
      dust.forEach(d=>{const px=(d.x*W)+Math.sin(sT*6.283/d.per+d.ph)*d.ax;
        const py=(d.y*H)+Math.cos(sT*6.283/(d.per*1.3)+d.ph)*d.ay;
        g.fillStyle='rgba(26,31,42,'+Math.min(1,.5+d.a)+')';
        g.beginPath();g.arc(px,py,d.r,0,6.283);g.fill();});
    } else if(scene==='fireflies'){
      const B=a=>'rgba(250,249,245,'+a+')';
      flies.forEach(f=>{const pr=((sT+f.ph)%f.per)/f.per,tw=Math.sin(pr*Math.PI);
        const px=(f.x*W)+Math.sin(sT*6.283/(f.per*2.1)+f.ph)*f.wx;
        const py=(f.y*H)+Math.cos(sT*6.283/(f.per*1.7)+f.ph)*f.wy;
        g.fillStyle=B(.12*tw);g.beginPath();g.arc(px,py,7,0,6.283);g.fill();
        g.fillStyle=B(.3*tw); g.beginPath();g.arc(px,py,4,0,6.283);g.fill();
        g.fillStyle=B(.85*tw);g.beginPath();g.arc(px,py,2.2,0,6.283);g.fill();});
    }
  }
  function tick(t){
    const dt=Math.min(.05,Math.max(0,t-sLast)); sLast=t; if(reduce)return;
    sT+=dt; breath=Math.sin(t*0.55)*0.5+0.5; breath2=Math.sin(t*0.41+0.7)*0.5+0.5;
    motes.forEach(m=>{m.y-=m.v*dt*3;m.x+=m.dx*dt*3;if(m.y<-.05){m.y=1.05;m.x=Math.random();}});
    strands.forEach(s2=>{s2.x+=s2.sp*dt;if(s2.x>1.15){s2.x=-.35;s2.y=.15+Math.random()*.7;}});
    if(scene==='pond'&&sT>=ripNext){rips.push({x:.2+Math.random()*.6,y:.25+Math.random()*.5,b:sT});
      ripNext=sT+4+Math.random()*5;if(rips.length>4)rips.shift();}
  }
  let running=false;
  function loop(){ requestAnimationFrame(loop); const t=performance.now()/1000; tick(t);
    for(let i=canvases.length-1;i>=0;i--){const cv=canvases[i];
      if(!cv.isConnected){canvases.splice(i,1);continue;} drawOne(cv);} }
  return { attach(cv){ if(cv&&canvases.indexOf(cv)<0)canvases.push(cv); if(!running){running=true;loop();} },
           set(sc){ if(sc&&sc!==scene){scene=sc;seed();} }, name(){return scene;},
           isDark(){return !!SCENE_DARK[scene];} };
})();


/* ---------------- live check-in (shared, parameterised per practice) ---------------- */

/* Live check-in — one implementation for every practice. Present publishes the
   session and mints a join code; each slide stamps the seam the SNB app listens
   to, so the app raises its own check-in at the right moment. Failure is
   graceful: the practice still runs. */
const SNB_LIVE = {
  fnBase: "https://piutnzwpbrydyipwaocl.supabase.co/functions/v1",
  anon:   "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBpdXRuendwYnJ5ZHlpcHdhb2NsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyNjEzMzcsImV4cCI6MjA5NzgzNzMzN30.sWJQ--a6-Wdodud6StMzfU_wwSCeUT-ThSRiOxbJ0uU",
  appBase:"https://app.stucknotbroken.com"
};
/* TEST MODE publishes NOTHING (Justin, 2026-08-30, after a member asked about a
   test run): no live session is created, so the app never hears about it and
   nobody is notified. The presenter still sees the join-overlay layout with a
   TEST placeholder. The old behavior — publishing a real session titled
   "test session (please ignore)" — still pinged everyone. */
let LIVE=null, LIVE_SEAM=undefined;
const stripProto=u=>(u||"").replace("https://","").replace("http://","");
async function sbFn(name, body){
  const r=await fetch(SNB_LIVE.fnBase+"/"+name,{method:"POST",
    headers:{"Content-Type":"application/json","apikey":SNB_LIVE.anon,"Authorization":"Bearer "+SNB_LIVE.anon},
    body:JSON.stringify(body)});
  let j={}; try{ j=await r.json(); }catch(e){}
  if(!r.ok) throw new Error((j&&j.error)||("HTTP "+r.status));
  return j;
}
function liveJoinURL(){ return (LIVE&&!LIVE.test)?(SNB_LIVE.appBase+"/?live="+LIVE.code):""; }
async function publishLive(){
  LIVE=null; LIVE_SEAM=undefined; updateConsoleJoin();
  const cfg=ACTIVE.live; if(!cfg){ return; }
  if(SHELL.testMode){
    LIVE={id:null, code:"TEST", presenter_key:null, test:true};
    updateConsoleJoin(); pushJoin(); return;
  }
  try{
    const j=await sbFn("publish-live-session",{
      type:cfg.type,
      recipe:(typeof ACTIVE.recipe==="function"?ACTIVE.recipe():{}),
      /* a practice may compute its practices list from the dials (CB names the
         two skills the presenter actually chose), so allow a function here. */
      practices:(typeof cfg.practices==="function"?cfg.practices():cfg.practices),
      duration_minutes:cfg.minutes||90,
      host:"the unstucking academy",
      invite:cfg.invite,
      room:((SHELL.room||"").trim()||null)});
    LIVE={id:j.id, code:j.code, presenter_key:j.presenter_key};
    updateConsoleJoin(); pushJoin(); postSeamForCurrent();
  }catch(err){ showLiveError(err); }
}
function seamFor(b){ return (ACTIVE.live && ACTIVE.seam) ? ACTIVE.seam(b) : null; }
function joinModeFor(b){
  /* AAMFT restraint (Justin, 2026-08-30: "we don't need the join code on
     every slide"): the code appears ONLY where a practice asks for the BIG
     panel — the opening and check-in slides. The per-slide corner reminder
     is retired; its CSS stays as a harmless fallback. */
  if(!LIVE) return "off";
  const m = ACTIVE.joinMode ? ACTIVE.joinMode(b) : "off";
  return m==="big" ? "big" : "off";
}
function pushJoin(){
  if(sw&&!sw.closed){ const b=pSlides[pIdx];
    sw.postMessage({snbJoin:{code:LIVE?LIVE.code:"",url:liveJoinURL(),mode:joinModeFor(b),test:!!(LIVE&&LIVE.test)}},"*"); }
}
async function postSeamForCurrent(){
  if(!LIVE||LIVE.test) return;
  const seam=seamFor(pSlides[pIdx]);
  if(seam===LIVE_SEAM) return; LIVE_SEAM=seam;
  try{ await sbFn("update-live-session",{id:LIVE.id,presenter_key:LIVE.presenter_key,seam:seam}); }catch(err){}
}
function endLive(){
  if(LIVE&&!LIVE.test){ sbFn("update-live-session",{id:LIVE.id,presenter_key:LIVE.presenter_key,live:false}).catch(function(){}); }
  if(sw&&!sw.closed) sw.postMessage({snbJoin:{mode:"off"}},"*");
  LIVE=null; LIVE_SEAM=undefined; updateConsoleJoin();
}
function updateConsoleJoin(){
  const txt=LIVE?(LIVE.test?"🧪 test mode — nothing published; the app is not notified"
                 :"live · code "+LIVE.code+" · "+stripProto(liveJoinURL())):"";
  const a=document.getElementById("pJoin"); if(a) a.textContent=txt;
  const b=document.getElementById("pJoinDial"); if(b) b.textContent=txt;
}
function showLiveError(err){
  const msg="live check-in unavailable (the practice still runs)";
  const a=document.getElementById("pJoin"); if(a) a.textContent=msg;
  const b=document.getElementById("pJoinDial"); if(b) b.textContent=msg;
  try{ console.warn("[live]",err); }catch(e){}
}
function renderJoin(el,j){
  if(!el) return;
  if(!j||j.mode==="off"||!j.code){ el.style.display="none"; el.innerHTML=""; el.className="joinbox"; return; }
  el.style.display=""; el.className="joinbox snbjoin "+(j.mode==="big"?"big":"corner");
  if(j.test){
    el.innerHTML='<div class="jtext"><div class="jlead">🧪 test session</div>'+
      '<div class="jcode">TEST</div>'+
      '<div class="jlead">not published — the app is not notified</div></div>';
    return;
  }
  let img="";
  try{ const q=qrcode(0,"M"); q.addData(j.url); q.make();
       img='<img class="qr" src="'+q.createDataURL(j.mode==="big"?6:4,2)+'" alt="join code">'; }catch(e){}
  el.innerHTML=img+'<div class="jtext"><div class="jlead">join &amp; check in</div>'+
    '<div class="jcode">'+j.code+'</div><a class="jlink" href="'+j.url+'">'+stripProto(j.url)+'</a></div>';
}


/* ---------------- shared site-data fill (MM's events slide uses it) ---------------- */
const SNB_SRC="https://raw.githubusercontent.com/justinlmft/stucknotbroken/main/site-data.json";
let SNB_DATA=null;
function snbGet(o,p){ return p.split('.').reduce((a,k)=>(a&&a[k]!=null)?a[k]:undefined,o); }
function applySNB(root){
  if(!SNB_DATA||!root) return;
  root.querySelectorAll('[data-snb]').forEach(n=>{
    const v=snbGet(SNB_DATA,n.getAttribute('data-snb'));
    if(typeof v==='string'||typeof v==='number') n.textContent=v;
  });
}
function fetchSNB(){
  try{
    const c=('AbortController' in window)?new AbortController():null;
    const t=c?setTimeout(()=>c.abort(),6000):null;
    fetch(SNB_SRC,c?{signal:c.signal,cache:'no-store'}:{cache:'no-store'})
      .then(r=>r.ok?r.json():Promise.reject(r.status))
      .then(d=>{ if(t)clearTimeout(t); SNB_DATA=d; applySNB(document); })
      .catch(()=>{ /* keep baked fallbacks */ });
  }catch(e){ /* keep baked fallbacks */ }
}


/* ---------------- break clock (shared) ---------------- */
let _brkInt=null;
function startBreakClock(root){
  if(_brkInt){clearInterval(_brkInt);_brkInt=null;}
  if(!root) return;
  const el=root.querySelector(".breakclock .bt"); if(!el) return;
  const total=parseInt(el.getAttribute("data-secs"),10)||0;
  const end=Date.now()+total*1000;
  const upd=()=>{ let rem=Math.round((end-Date.now())/1000); if(rem<0)rem=0;
    el.textContent=Math.floor(rem/60)+":"+String(rem%60).padStart(2,"0");
    if(rem<=0){clearInterval(_brkInt);_brkInt=null;} };
  upd(); _brkInt=setInterval(upd,250);
}

/* ---------------- practice switching ---------------- */
function practiceKeys(){ return Object.keys(PRACTICES); }
function setPractice(id, skipRender){
  if(!PRACTICES[id]) id = practiceKeys()[0];
  ACTIVE = PRACTICES[id];
  /* the verbatim dial markup and generated inline handlers reference `st` and
     `render()` as globals — point them at the active module. Same object, so
     mutations land on the module's own state. */
  window.st = ACTIVE.st;
  Object.keys(ACTIVE.globals||{}).forEach(k=>{ if(ACTIVE.globals[k]!==undefined) window[k]=ACTIVE.globals[k]; });
  curTab = Object.keys(ACTIVE.TABS)[0];
  const dialsEl=document.getElementById("practiceDials");
  if(dialsEl) dialsEl.innerHTML = ACTIVE.dialsHTML;
  /* the student window has no builder chrome — guard every chrome node */
  const hT=document.getElementById("hTitle"); if(hT) hT.textContent = ACTIVE.label + " — Session Builder";
  const hB=document.getElementById("hBlurb"); if(hB) hB.textContent = ACTIVE.blurb;
  try{ history.replaceState(null,"","?p="+id); }catch(e){}
  if(!skipRender) render();
}
function pickerHTML(){
  return practiceKeys().map(k=>'<div class="p'+(ACTIVE&&ACTIVE.id===k?' sel':'')+'" onclick="setPractice(\''+k+'\')">'+PRACTICES[k].label+'</div>').join("");
}

/* ---------------- scene picker (shared) ---------------- */
function sceneChipsShell(){
  const el=document.getElementById("sceneOpts"); if(!el) return; el.innerHTML="";
  [["","surprise me"]].concat(SCENE_LIST.map(x=>[x,x])).forEach(([v,label])=>{
    const d=document.createElement("div");
    d.className="opt"+(SHELL.scene===v?" sel":"");
    d.textContent=label;
    d.onclick=()=>{ SHELL.scene=v; render(); };
    el.appendChild(d);
  });
  const c=document.getElementById("sceneCap"); if(c) c.textContent=SCENE_CAP[SHELL.scene]||"";
}
function rollAll(){
  const scenes=SCENE_LIST.filter(s=>s!==SHELL.scene);
  SHELL.scene=scenes[Math.floor(Math.random()*scenes.length)];
  if(ACTIVE && typeof ACTIVE.roll==="function") ACTIVE.roll();
  render();
}

/* ---------------- render (the generic tail every source tool shared) ---------------- */
function render(){
  if(IS_STUDENT) return;
  document.getElementById("picker").innerHTML = pickerHTML();
  ACTIVE.renderDials();
  sceneChipsShell();
  { const t=document.getElementById("tTestS"); if(t) t.checked=SHELL.testMode; }
  { const r=document.getElementById("tRoomS"); if(r && r.value!==SHELL.room) r.value=SHELL.room; }
  document.getElementById("liveNote").textContent =
    ACTIVE.live ? ("check-in seams: "+ACTIVE.live.seams.join(" · ")) : "this practice has no app check-in slides yet.";

  document.getElementById("sName").textContent = ACTIVE.sessionName ? ACTIVE.sessionName() : ACTIVE.label;
  const agenda = ACTIVE.agenda ? ACTIVE.agenda() : [];
  document.getElementById("sAgenda").innerHTML =
    agenda.map((n,i)=>'<span class="step"><span class="num">'+(i+1)+'</span>'+n+'</span>').join('<span class="arr">→</span>');

  const beats = ACTIVE.buildBeats();
  document.getElementById("slideCount").textContent = beats.length+" slides total";
  const tabsEl=document.getElementById("tabs"); tabsEl.innerHTML="";
  Object.keys(ACTIVE.TABS).forEach(k=>{
    const n=beats.filter(b=>b.section===k).length;
    const d=document.createElement("div");
    d.className="tab"+(curTab===k?" sel":"");
    d.innerHTML=ACTIVE.TABS[k]+' <span style="opacity:.6">'+n+'</span>';
    d.onclick=()=>{ curTab=k; render(); };
    tabsEl.appendChild(d);
  });
  document.getElementById("slidesView").innerHTML = slidesHTML(beats.filter(b=>b.section===curTab), ACTIVE);
  applySNB(document.getElementById("slidesView"));
}
window.addEventListener("beforeprint",()=>{ if(!IS_STUDENT) document.getElementById("slidesView").innerHTML=slidesHTML(ACTIVE.buildBeats(), ACTIVE); });
window.addEventListener("afterprint",()=>{ if(!IS_STUDENT) render(); });

/* ---------------- present: student window + presenter console ---------------- */
let pSlides=[], pIdx=0, sw=null;
function studentURL(){ return location.href.split("#")[0].split("?")[0]+"?student=1"; }
function openStudentWindow(){
  sw=window.open(studentURL(),"snb_student","width=1280,height=800");
  if(!sw){ alert("Pop-up blocked — allow pop-ups for this page so the student window can open."); return false; }
  return true;
}
function frameHTML(b, sceneOn, dark, inner){
  return '<div class="frame snbframe'+(sceneOn?" scene-on":"")+(dark?" dark":"")+'">'+
    '<canvas class="ambient"></canvas><div class="slot">'+inner+'</div>'+
    '<div class="joinbox" id="joinbox" style="display:none"></div></div>';
}
window.addEventListener("message",e=>{
  const d=e.data||{};
  if(IS_STUDENT){
    if(d.snbPractice && (!ACTIVE || ACTIVE.id!==d.snbPractice)) setPractice(d.snbPractice, true);
    if(d.snbSceneName) AMB.set(d.snbSceneName);
    if(d.snbSlide!==undefined){
      const root=document.getElementById("stage");
      root.innerHTML=frameHTML(null, !!d.snbScene, !!d.snbScene && AMB.isDark(), d.snbSlide);
      AMB.attach(root.querySelector("canvas.ambient"));
      startBreakClock(root);
      applySNB(root);
      if(d.snbJoin) renderJoin(root.querySelector("#joinbox"), d.snbJoin);
    }
    if(d.snbJoin!==undefined){ const jb=document.querySelector("#joinbox"); if(jb) renderJoin(jb,d.snbJoin); }
    return;
  }
  if(d.snbReady){ pRender(); pushJoin(); }
  else if(d.snbNav===1) pNext();
  else if(d.snbNav===-1) pPrev();
});
function bootStudent(){
  document.title="SNB — Slides";
  document.body.innerHTML='<div id="stage" style="position:absolute;inset:0"></div>';
  const css=document.createElement("style");
  css.textContent='html,body{margin:0;height:100%;overflow:hidden;background:#FAF9F5}';
  document.head.appendChild(css);
  document.addEventListener("keydown",e=>{
    if(!window.opener)return;
    if(e.key==="ArrowRight"||e.key===" ")window.opener.postMessage({snbNav:1},"*");
    else if(e.key==="ArrowLeft")window.opener.postMessage({snbNav:-1},"*");
  });
  if(window.opener)window.opener.postMessage({snbReady:1},"*");
  fetchSNB();
}
function fmtNote(n){
  if(!n) return "";
  let html="";
  String(n).split(/<br>| — /).forEach(part=>{
    part=part.trim(); if(!part) return;
    const qs=part.match(/[^?]+\?/g);
    const onlyQs=qs && qs.join("").replace(/\s/g,"")===part.replace(/\s/g,"");
    if(qs && qs.length>1 && onlyQs && qs.every(x=>x.trim().length<48)){
      html+='<ul>'+qs.map(x=>'<li>'+x.trim()+'</li>').join("")+'</ul>';
    } else html+='<p>'+part+'</p>';
  });
  return html;
}
function pRender(){
  if(!pSlides.length)return;
  const b=pSlides[pIdx];
  const sceneOn = ACTIVE.sceneOn ? ACTIVE.sceneOn(b) : false;
  const sceneNm = SHELL.scene || _sessionScene;
  AMB.set(sceneNm);
  const join = LIVE ? {code:LIVE.code,url:liveJoinURL(),mode:joinModeFor(b)} : {mode:"off"};
  if(sw && !sw.closed) sw.postMessage({snbPractice:ACTIVE.id, snbSlide:renderSlide(ACTIVE.map(b)),
    snbScene:sceneOn, snbSceneName:sceneNm, snbJoin:join},"*");
  const pv=document.getElementById("pvBox");
  pv.innerHTML=frameHTML(b, sceneOn, sceneOn&&AMB.isDark(), renderSlide(ACTIVE.map(b)));
  AMB.attach(pv.querySelector("canvas.ambient"));
  startBreakClock(pv); applySNB(pv);
  renderJoin(pv.querySelector("#joinbox"), join);
  document.getElementById("cNotes").innerHTML=fmtNote(b.note);
  const nxt=pSlides[pIdx+1];
  document.getElementById("cNext").innerHTML=nxt?("Next: <b>"+String(nxt.h||"").replace(/<br>/g," ")+"</b>"):"Next: — end of session —";
  document.getElementById("pCount").textContent=(pIdx+1)+" / "+pSlides.length;
  document.getElementById("pSec").textContent=(ACTIVE.TABS[b.section]||"")+" · "+ACTIVE.label;
  postSeamForCurrent();
}
function startPresent(){
  if(!openStudentWindow())return;
  pSlides=ACTIVE.buildBeats();
  pIdx=Math.max(0,pSlides.findIndex(b=>b.section===curTab));
  if(!SHELL.scene) rollSessionScene();
  document.getElementById("console").classList.add("on");
  publishLive();
  pRender();
}
function endPresent(){
  endLive();
  document.getElementById("console").classList.remove("on");
  if(sw && !sw.closed) sw.close();
  sw=null;
}
function pNext(e){ if(e)e.stopPropagation(); if(pIdx<pSlides.length-1){pIdx++;pRender();} }
function pPrev(e){ if(e)e.stopPropagation(); if(pIdx>0){pIdx--;pRender();} }
document.addEventListener("keydown",e=>{
  if(IS_STUDENT)return;
  const c=document.getElementById("console");
  if(!c||!c.classList.contains("on"))return;
  if(e.key==="ArrowRight"||e.key===" ")pNext();
  else if(e.key==="ArrowLeft")pPrev();
  else if(e.key==="Escape")endPresent();
});

/* ---------------- draggable left menu ---------------- */
(function(){
  const sp=document.getElementById("splitter"); if(!sp) return;
  const dials=document.querySelector(".dials"); let dragging=false;
  sp.addEventListener("pointerdown",e=>{dragging=true;sp.classList.add("dragging");sp.setPointerCapture(e.pointerId);document.body.style.userSelect="none";});
  sp.addEventListener("pointermove",e=>{ if(!dragging)return;
    const w=Math.max(280,Math.min(580,e.clientX-dials.getBoundingClientRect().left));
    dials.style.flex="0 0 "+w+"px"; dials.style.width=w+"px"; });
  const stop=()=>{dragging=false;sp.classList.remove("dragging");document.body.style.userSelect="";};
  sp.addEventListener("pointerup",stop); sp.addEventListener("pointercancel",stop);
})();

/* ---------------- boot ---------------- */
(function(){
  const want=(location.search.match(/[?&]p=([a-z]+)/)||[])[1];
  if(IS_STUDENT){ setPractice(want||practiceKeys()[0], true); bootStudent(); }
  else { setPractice(want||practiceKeys()[0]); fetchSNB(); }
})();
