<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNB Session Builder</title>
<style>

  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;400;500;600;700&display=swap');
  :root{
    --bone:#FAF9F5; --ink:#1a1f2a; --line:#e4e1d8; --card:#ffffff;
    --muted:#8a877e; --soft:#f1efe8; --draft:#b9842f; --notes:#6b685f;
    --safety:#3b6ea5; --defense:#a5573b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:var(--bone);color:var(--ink);line-height:1.5;height:100vh;overflow:hidden;display:flex;flex-direction:column}
  header{padding:18px 26px;border-bottom:1px solid var(--line);flex:0 0 auto}
  header h1{margin:0;font-size:19px;letter-spacing:.2px;font-weight:700}
  .wrap{display:flex;flex:1;min-height:0}
  .panel{padding:22px 26px}
  .dials{width:360px;flex:0 0 360px;overflow-y:auto;display:flex;flex-direction:column}
  #splitter{flex:0 0 7px;cursor:col-resize;border-left:1px solid var(--line);transition:background .12s}
  #splitter:hover,#splitter.dragging{background:var(--line)}
  .out{flex:1;min-width:0;overflow:hidden;display:flex;flex-direction:column}
  .out .tabs{flex:0 0 auto}
  #slidesWrap{flex:1;min-height:0;overflow-y:auto;padding-top:2px}
  .dial{margin-bottom:24px}
  .dial.sep{border-top:2px solid var(--line);padding-top:22px;margin-top:2px}
  .dial label.h{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--ink);margin-bottom:10px;font-weight:700}
  .sub{font-size:12px;color:var(--muted);margin:-4px 0 10px;line-height:1.5}
  .opts{display:flex;flex-wrap:wrap;gap:6px}
  .opt{border:1px solid var(--line);background:var(--card);color:var(--ink);
    padding:7px 11px;border-radius:8px;cursor:pointer;font-size:13px;transition:.12s;display:flex;align-items:center;gap:7px}
  .opt:hover{border-color:var(--ink)}
  .opt.sel{background:var(--ink);border-color:var(--ink);color:var(--bone);font-weight:600}
  .opt .ord{width:18px;height:18px;border-radius:50%;background:var(--bone);color:var(--ink);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
  .wkgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .wk{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 4px;cursor:pointer;
    text-align:center;transition:.12s}
  .wk:hover{border-color:var(--ink)}
  .wk.sel{background:var(--ink);border-color:var(--ink);color:var(--bone)}
  .wk .n{font-size:15px;font-weight:800;line-height:1.1}
  .wk .l{font-size:9px;letter-spacing:.3px;text-transform:uppercase;opacity:.75;margin-top:3px;line-height:1.15;
    overflow-wrap:normal;word-break:keep-all}
  .toggle{display:flex;align-items:flex-start;gap:9px;font-size:13px;cursor:pointer;margin-top:9px;line-height:1.45}
  .toggle input{width:15px;height:15px;accent-color:var(--ink);margin-top:2px;flex:0 0 auto}
  .numrow{display:flex;align-items:center;gap:9px;font-size:13px}
  .numrow input{width:64px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;font-family:inherit;font-size:13px}
  .randbar{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .tabs{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
  .tab{padding:8px 16px;border:1px solid var(--line);border-bottom:none;background:var(--soft);color:var(--muted);
    border-radius:9px 9px 0 0;cursor:pointer;font-size:13px;transition:.12s;position:relative;top:1px}
  .tab:hover{color:var(--ink)}
  .tab.sel{background:var(--bone);color:var(--ink);border-bottom:1px solid var(--bone);font-weight:600}
  .name{font-size:17px;font-weight:700;margin:0 0 4px}
  .flow{display:flex;gap:8px;align-items:center;margin:2px 0 16px;flex-wrap:wrap}
  .flow .step{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);
    border-radius:999px;padding:4px 12px 4px 5px;font-size:12.5px;font-weight:600}
  .flow .num{width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--bone);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
  .flow .arr{color:var(--muted);font-size:14px}
  .bar{display:flex;gap:9px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
  .btn{padding:8px 14px;border:1px solid var(--ink);background:var(--ink);color:var(--bone);
    border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit}
  .btn:hover{opacity:.85}
  .btn.ghost{background:transparent;color:var(--ink)}
  .count{font-size:12px;color:var(--muted)}
  .slide{border:1px solid var(--line);border-radius:10px;padding:13px 16px;margin-bottom:10px;background:var(--card)}
  .slide.fixedc{border-style:dashed;background:transparent}
  .slide .tag{font-size:10px;text-transform:uppercase;letter-spacing:1.1px;margin-bottom:5px;color:var(--muted)}
  .slide .stu{font-size:16px;margin:2px 0 0;font-weight:600}
  .slide .bod{font-size:13px;color:var(--ink);opacity:.75;margin:5px 0 0;line-height:1.6}
  .slide .note{font-size:12.5px;color:var(--notes);margin:8px 0 0;padding-left:10px;border-left:2px solid var(--line);line-height:1.6}
  .slide .note b{font-weight:600;text-transform:uppercase;letter-spacing:.8px;font-size:10px;color:var(--muted)}

  /* ---------- PRESENTER CONSOLE ---------- */
  #console{position:fixed;inset:0;background:var(--bone);display:none;flex-direction:column;z-index:50}
  #console.on{display:flex}
  .cTop{display:flex;justify-content:space-between;align-items:center;padding:14px 26px;border-bottom:1px solid var(--line)}
  .cTop .cnt{font-size:14px;color:var(--muted)}
  .cTop .sec{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);font-weight:700}
  .cMain{flex:1;display:flex;min-height:0}
  .cPrev{flex:0 0 46%;padding:22px;display:flex;flex-direction:column;gap:12px;border-right:1px solid var(--line)}
  .pvLabel{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);font-weight:600}
  .pvBox{border:1px solid var(--line);background:#fff;overflow:hidden;position:relative;width:100%;aspect-ratio:16/9;border-radius:6px}
  .cNext{font-size:14px;color:var(--muted)}
  .cNext b{color:var(--ink);font-weight:600}
  .cNotes{flex:1;padding:26px;overflow-y:auto}
  .cNotes .nh{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);font-weight:600;margin-bottom:12px}
  .cNotes .nt{font-size:19px;line-height:1.6;color:var(--ink);max-width:660px}
  .cNotes .nt p{margin:0 0 12px}
  .cNotes .nt ul{margin:0 0 14px;padding-left:24px}
  .cNotes .nt li{margin:5px 0}
  .cNotes .nt:empty::before{content:"— (lots of quiet) —";color:var(--muted)}
  .cBot{display:flex;justify-content:space-between;align-items:center;padding:14px 26px;border-top:1px solid var(--line)}
  .cBot button{background:var(--ink);border:1px solid var(--ink);color:var(--bone);border-radius:8px;padding:9px 18px;cursor:pointer;font-size:14px;margin-left:8px;font-family:inherit}
  .cBot button.ghost{background:transparent;color:var(--ink)}
  .shareTip{font-size:12px;color:var(--muted)}

  @media print{
    .dials,.bar,.tabs,#console,#splitter{display:none}
    body{background:#fff;color:#000;height:auto;overflow:visible;display:block}
    .slide{border-color:#bbb;background:#fff;color:#000}
    .wrap{display:block}
    .out{overflow:visible;display:block}
    #slidesWrap{overflow:visible}
  }

/* ---- Capacity Builder panel controls ----
   Restored 2026-08-05. These rules live in the CB source stylesheet and were
   missed when the four tools moved to one shared panel stylesheet, so CB's
   mini-chips rendered as a run-on string ("Hold15s30s45s60s90s120s") instead of
   buttons. Copied verbatim from the CB source. */
.opt.check{background:var(--card);border-color:var(--ink);color:var(--ink);font-weight:600}
.opt.check::before{content:"✓ ";font-weight:700}
.opt .dr{font-size:10px;color:var(--draft);font-style:italic}
.opt.sel .dr{color:var(--bone)}
.toggle .dr{font-size:11px;color:var(--draft);font-style:italic}
.vars{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line)}
.mini{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:13px}
.mini .mopt{border:1px solid var(--line);background:var(--card);padding:3px 9px;border-radius:7px;cursor:pointer;font-size:12px}
.mini .mopt.sel{background:var(--card);border-color:var(--ink);font-weight:600}
.mini .mopt.sel::before{content:"✓ ";font-weight:700}
.hint{font-size:12px;color:var(--muted);margin:0 0 16px}

/* live join overlay — AAMFT geometry (Justin, 2026-08-30: "everything should
   feel the same as the AAMFT slides"). The BIG panel occupies the image-well
   slot exactly — left on --artl, right on the margin, top on the body line,
   bottom on the foot line — so a QR slide and a photo slide sit on the same
   grid. The CORNER reminder is a compact text card in the foot band on the
   same right margin (no QR: the scannable code lives on the check-in slides,
   the corner carries the code and link). */
.frame .snbjoin{display:flex;align-items:center;background:rgba(250,249,245,.94);
  border:1px solid #1a1f2a24;border-radius:var(--radius,12px);box-shadow:0 6px 22px rgba(26,31,42,.10)}
.frame.dark .snbjoin{background:rgba(26,31,42,.9);color:#FAF9F5;border-color:#ffffff2b}
.frame .snbjoin .qr{display:block;background:#fff;border-radius:7px}
.frame .snbjoin .jlead{font-size:clamp(8px,1cqw,14px);letter-spacing:.13em;text-transform:uppercase;color:#8a877e}
.frame .snbjoin .jcode{font-weight:700;letter-spacing:.16em}
.frame .snbjoin .jlink{color:inherit;opacity:.72;text-decoration:none}
.frame .snbjoin .jtext{display:flex;flex-direction:column;gap:.5cqh}
.frame .snbjoin.big{background:#fff;box-shadow:none;position:absolute;
  left:var(--artl,68cqw);right:var(--mx,6.25cqw);
  top:var(--bodyl,29.9cqh);bottom:calc(100cqh - var(--footl,90.5cqh));
  flex-direction:column;justify-content:center;text-align:center;gap:1.5cqh;
  padding:2.6cqh 1.6cqw}
.frame .snbjoin.big .qr{width:min(26cqh,17cqw);height:auto;padding:5px}
.frame .snbjoin.big .jcode{font-size:clamp(20px,3.1cqw,46px);margin-top:.3cqh}
.frame .snbjoin.big .jlink{font-size:clamp(9px,1.15cqw,17px)}
.frame .snbjoin.corner{position:absolute;bottom:1.4cqh;right:var(--railr,6.25cqw);
  gap:1.1cqw;padding:.7cqh 1.2cqw;max-height:7.6cqh;box-sizing:border-box}
.frame .snbjoin.corner .qr{display:none}
.frame .snbjoin.corner .jtext{gap:.2cqh;text-align:left}
.frame .snbjoin.corner .jlead{font-size:clamp(7px,.8cqw,11px)}
.frame .snbjoin.corner .jcode{font-size:clamp(11px,1.5cqw,22px)}
.frame .snbjoin.corner .jlink{display:none}
/* The join block and the break clock share the bottom-right corner, and the
   join box was painting over the countdown — Justin saw this live on a capacity
   slide before CB ever had check-ins, so it bit MM/SRS/SS too. Stack them on the
   one right rail (--railr) instead: clock on the floor, join block above it,
   both flush to the same edge. Justin, 2026-08-10. */
.frame:has(.breakclock) .snbjoin.corner{bottom:16cqh}

/* ==================================================================
   SNB SLIDE DESIGN LANGUAGE — one system, every practice.
   Adopted 2026-08-04 from the Self-Regulation Simplified decisions:
   everything left-aligned on one Swiss grid, no colour rails, eyebrows
   left, a soft veil so text stays legible over the ambient field, and
   the rise-in motion on content only (logo + byline never animate).
   ================================================================== */
.snbframe{position:absolute;inset:0;container-type:size;background:#FAF9F5;color:#1a1f2a;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;overflow:hidden;
  transition:background-color .7s cubic-bezier(.22,1,.36,1)}

/* the invisible grid every slide snaps to.
   --railr is the right rail: the break clock and the join block both hang off
   it, so they line up instead of drifting apart (Justin, 2026-08-10). It now
   sits ON the right margin, so everything on the right shares one edge.
   The AAMFT lines (Justin, 2026-08-30: "everything should feel the same as
   the AAMFT slides"): --artl is the image well's left edge, --bodyl the body
   start line the well tops out on, --footl the foot line it bottoms out on —
   lifted from the AAMFT 16:9 deck (artl 68cqw; body 29.9 / foot 90.5). */
.snbframe{--mx:6.25cqw;--top:11cqh;--gut:3cqh;--foot:6.5cqh;--railr:6.25cqw;--veil:rgba(250,249,245,.70);
  --artl:68cqw;--bodyl:29.9cqh;--footl:90.5cqh;--colgap:2cqw;--radius:1.8cqh}
/* the two light-based scenes bring a dark field with them, as in the app */
.snbframe.dark{background:#1a1f2a;color:#FAF9F5;--veil:rgba(26,31,42,.72)}

.snbframe .s{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:flex-start;
  padding:var(--top) var(--mx) calc(var(--foot) + 4cqh)}

/* eyebrow — meta line, top left, on the same column as everything else */
.snbframe .eyebrow{align-self:stretch;text-align:left;margin:0 0 var(--gut);
  font-size:clamp(8px,1cqw,15px);font-weight:400;letter-spacing:.14em;text-transform:uppercase;
  color:#8a877e;line-height:1.8;min-height:1.8em}
.snbframe.dark .eyebrow{color:#a9a69c}

/* headline scale — one ramp, by slide weight */
.snbframe h1{margin:0;font-weight:400;line-height:1.06;letter-spacing:-.03em;max-width:80cqw}
.snbframe .s.cover h1  {font-size:clamp(28px,5.4cqw,96px)}
.snbframe .s.ptitle h1 {font-size:clamp(26px,5cqw,88px)}
.snbframe .s.checkin h1{font-size:clamp(26px,5cqw,88px)}
.snbframe .s.info h1   {font-size:clamp(24px,4.4cqw,76px);line-height:1.08}
.snbframe .s.events h1 {font-size:clamp(24px,4.4cqw,76px)}
.snbframe .s.story h1  {font-size:clamp(18px,3.2cqw,56px);font-weight:500;line-height:1.1;letter-spacing:-.02em}

/* body block — one treatment, at the AAMFT body size (Justin, 2026-08-30:
   "make the text very legible"). The AAMFT deck holds ONE size for every
   body-copy role, sized off the frame HEIGHT so it never shrinks with a
   narrow window. Base raised past the AAMFT 2.94cqh to 3.3cqh — Justin asked
   for VERY legible, and the cohort vignettes are read aloud across Zoom. */
.snbframe .body{margin-top:var(--gut);line-height:1.5;color:#3b3f48;font-weight:400;
  font-size:max(13px,3.3cqh);max-width:74cqw}
.snbframe.dark .body{color:#cfcdc6}
.snbframe .body b{font-weight:600;color:#1a1f2a}
.snbframe.dark .body b{color:#FAF9F5}
.snbframe .body em{font-style:italic}
.snbframe .s.story .body{font-size:max(13px,3.3cqh);line-height:1.5;max-width:76cqw}
.snbframe .s.ptitle .body,.snbframe .s.checkin .body{color:#6b685f;max-width:70cqw}
/* check-in slides host the big join panel in the AAMFT well slot, so their
   text keeps to the text column like any slide with a filled well */
.snbframe .s.checkin h1{max-width:calc(var(--artl) - var(--mx) - var(--colgap))}
.snbframe .s.checkin .body{max-width:calc(var(--artl) - var(--mx) - var(--colgap))}
.snbframe.dark .s.ptitle .body,.snbframe.dark .s.checkin .body{color:#a9a69c}

/* ---- prompt: the practice line. Sits on the same top line as every other
   heading so it stays clear of the busy part of the field (reeds rise from the
   bottom, the circles breathe in the middle). The veil keeps it legible over
   any scene, light or dark. ---- */
.snbframe .s.prompt{padding:var(--top) var(--mx) calc(var(--foot) + 4cqh)}
.snbframe .s.prompt .p{font-size:clamp(20px,4cqw,66px);font-weight:400;letter-spacing:-.02em;
  line-height:1.14;max-width:80cqw;position:relative;isolation:isolate}
.snbframe .s.prompt .p::before{content:"";position:absolute;z-index:-1;left:50%;top:50%;
  transform:translate(-50%,-50%);width:118%;height:230%;border-radius:50%;pointer-events:none;
  background:radial-gradient(ellipse at center,var(--veil) 0%,var(--veil) 42%,transparent 74%)}

/* ---- image well: THE AAMFT PANEL, verbatim geometry (Justin, 2026-08-30).
   One right column for every slide kind: left edge on --artl, right edge on
   the margin, top on the body line, bottom on the foot line — figure and text
   share the same horizontal rules, exactly as in the AAMFT deck. Present only
   when the slide declares img and images/<marker> exists; the text column
   stops a --colgap short of the well and takes the grid back when the well
   is empty. ---- */
.snbframe .s.haswell h1{max-width:calc(var(--artl) - var(--mx) - var(--colgap))}
.snbframe .s.haswell .body{max-width:calc(var(--artl) - var(--mx) - var(--colgap))}
.snbframe .well{position:absolute;left:var(--artl);right:var(--mx);
  top:var(--bodyl);bottom:calc(100cqh - var(--footl));
  border-radius:var(--radius);overflow:hidden}
.snbframe .well img{display:block;width:100%;height:100%;
  object-fit:cover;border-radius:var(--radius)}
/* fit ramp — a safety valve for the longest vignettes only. Kept shallow so
   even a stepped-down slide stays close to the AAMFT body size. */
.snbframe .s.story.x1 .body{font-size:max(12px,2.9cqh);line-height:1.45}
.snbframe .s.story.x2 .body{font-size:max(11px,2.55cqh);line-height:1.38}
.snbframe .s.story.x2 h1{font-size:clamp(16px,2.7cqw,46px)}
.snbframe .s.story.x3 .body{font-size:max(10px,2.25cqh);line-height:1.34}
.snbframe .s.story.x3 h1{font-size:clamp(16px,2.7cqw,46px)}

/* ---- flow chips (session map on a cover slide) ---- */
.snbframe .flow{display:flex;gap:1.4cqw;align-items:center;flex-wrap:wrap;margin-top:var(--gut)}
.snbframe .flow .step{border:1px solid #1a1f2a40;background:transparent;border-radius:999px;
  padding:.9cqh 1.9cqw;font-size:clamp(11px,1.5cqw,23px);font-weight:500;white-space:nowrap}
.snbframe.dark .flow .step{border-color:#ffffff40}
.snbframe .flow .arr{color:#8a877e;font-size:clamp(12px,1.7cqw,26px)}

/* ---- footer: same baseline everywhere, and it never animates ---- */
.snbframe .foot{position:absolute;left:var(--mx);bottom:var(--foot);display:flex;align-items:center;gap:1.6cqw}
.snbframe .foot .logo{height:clamp(20px,4.4cqh,50px);width:auto;display:block}
.snbframe .foot .byline{font-size:clamp(6px,.78cqw,12px);letter-spacing:.1em;color:#8a877e;text-transform:uppercase}

/* ---- break clock, bottom right ---- */
.snbframe .breakclock{position:absolute;right:var(--railr);bottom:5cqh;display:flex;flex-direction:column;
  align-items:flex-end;gap:.4cqh;color:#8a877e}
.snbframe .breakclock .bl{font-size:clamp(7px,.9cqw,13px);letter-spacing:.16em;text-transform:uppercase;opacity:.7}
.snbframe .breakclock .bt{font-size:clamp(13px,1.9cqw,30px);font-variant-numeric:tabular-nums;opacity:.85}

/* ---- events list (the closing invitation) ---- */
.snbframe .evlist{list-style:none;margin:var(--gut) 0 0;padding:0;align-self:stretch}
.snbframe .evlist li{display:grid;grid-template-columns:1fr auto 14cqw;align-items:baseline;gap:3cqw;
  padding:1.3cqh 0;border-bottom:1px solid #1a1f2a1f;font-size:clamp(11px,1.35cqw,23px)}
.snbframe .evlist .evhead{font-size:clamp(8px,.92cqw,14px);letter-spacing:.1em;text-transform:uppercase;
  color:#8a877e;border-bottom:1px solid #1a1f2a33}
.snbframe .evlist .evname{font-weight:500}
.snbframe .evlist .evwhen{color:#6b685f;font-size:clamp(10px,1.1cqw,18px)}
.snbframe .evlist .evmark{text-align:right;font-size:clamp(10px,1.1cqw,18px)}
.snbframe .evlist .evhead .evmark,.snbframe .evlist .evhead .evwhen{color:#8a877e;font-size:inherit}
.snbframe .evlist li .evmark.yes{color:#3b6ea5;font-weight:700}
.snbframe .evlist li .evmark.free{color:#8a877e;font-style:italic}
.snbframe .evnote{margin-top:2.6cqh;font-size:clamp(9px,1.1cqw,17px);color:#8a877e}

/* ---- motion: the SNB rise-in, content only ---- */
@keyframes snbRise{from{opacity:0;transform:translateY(10px);filter:blur(2px)}
                   to{opacity:1;transform:none;filter:blur(0)}}
.snbframe .s > *:not(.foot){animation:snbRise .62s cubic-bezier(.22,.61,.36,1) both}
.snbframe .s > *:not(.foot):nth-child(2){animation-delay:.09s}
.snbframe .s > *:not(.foot):nth-child(3){animation-delay:.18s}
.snbframe .s > *:not(.foot):nth-child(4){animation-delay:.27s}
.snbframe .s .foot{animation:none}
@media (prefers-reduced-motion:reduce){
  .snbframe .s > *{animation:none;opacity:1;transform:none;filter:none}
  .snbframe{transition:none}
}

  /* ---------- practice picker (shell-only chrome) ---------- */
  .pick{display:flex;gap:6px;align-items:center;margin-left:auto}
  .pick .p{border:1px solid var(--line);background:var(--card);color:var(--ink);
    padding:7px 13px;border-radius:8px;cursor:pointer;font-size:13px;transition:.12s;font-weight:500}
  .pick .p:hover{border-color:var(--ink)}
  .pick .p.sel{background:var(--ink);border-color:var(--ink);color:var(--bone);font-weight:600}
  header .blurb{margin:3px 0 0;color:var(--muted);font-size:12.5px}
  /* the ambient field + slide slot are shell-owned; each practice's own frame
     class still styles everything inside .slot exactly as it did standalone */
  .frame{position:absolute;inset:0;container-type:size;overflow:hidden}
  .frame canvas.ambient{position:absolute;inset:0;width:100%;height:100%;z-index:0;
    opacity:0;transition:opacity .9s cubic-bezier(.22,.61,.36,1);pointer-events:none}
  .frame.scene-on canvas.ambient{opacity:.4}
  .frame .slot{position:absolute;inset:0;z-index:1}
  .frame .joinbox{position:absolute;z-index:3}
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:14px">
    <img src="https://static.wixstatic.com/media/2d354d_b31143f17d0b49b08b0f3df8b49c78f3~mv2.png" alt="Unstucking Academy" style="height:34px;width:auto;display:block">
    <div>
      <h1 id="hTitle">SNB Session Builder</h1>
      <p class="blurb" id="hBlurb"></p>
    </div>
    <div class="pick" id="picker"></div>
  </div>
</header>

<div class="wrap">
  <div class="panel dials">
    <div id="practiceDials"></div>

    <div class="dial sep">
      <label class="h">Practice scene</label>
      <p class="sub">The living backdrop from the app, behind the practice words. Subtle, and it honors Reduce Motion.</p>
      <div class="opts" id="sceneOpts"></div>
      <p class="sub" id="sceneCap" style="margin:10px 0 0"></p>
    </div>

    <div class="dial sep">
      <label class="h">Live session</label>
      <label class="toggle"><input type="checkbox" id="tTestS" onchange="SHELL.testMode=this.checked;if(typeof LIVE!=='undefined'&&LIVE){endLive();publishLive();}render()"> 🧪 Test session <span style="color:var(--muted)">— publishes nothing; members are never notified</span></label>
      <label class="h" style="margin-top:12px;display:block">Live room URL <input type="text" id="tRoomS" placeholder="https://… (blank = auto from the Academy calendar)" oninput="SHELL.room=this.value.trim()" style="display:block;width:100%;margin-top:5px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13px;box-sizing:border-box"></label>
      <p class="sub" id="liveNote" style="margin:10px 0 0"></p>
    </div>

    <div class="randbar">
      <!-- ghost (outlined ink, not filled): this is a "try something" convenience, not the
           primary action on the panel — Present is. Justin, 2026-08-10. Label is "Randomize"
           because rollAll() rolls the scene AND every practice dial, not just anchor + scene. -->
      <button class="btn ghost" style="width:100%" onclick="rollAll()">🎲 Randomize</button>
      <p class="sub" id="pJoinDial" style="margin:4px 0 0"></p>
    </div>
  </div>

  <div id="splitter"></div>

  <div class="panel out">
    <p class="name" id="sName"></p>
    <div class="flow" id="sAgenda"></div>
    <div class="bar">
      <button class="btn" onclick="startPresent()">▶ Present</button>
      <button class="btn ghost" onclick="window.print()">Print / Save PDF</button>
      <span class="count" id="slideCount"></span>
    </div>
    <div class="tabs" id="tabs"></div>
    <div id="slidesWrap"><div id="slidesView"></div></div>
  </div>
</div>

<div id="console">
  <div class="cTop"><span class="sec" id="pSec"></span>
    <span class="cnt" id="pJoin" style="letter-spacing:.04em"></span>
    <span class="cnt" id="pCount"></span></div>
  <div class="cMain">
    <div class="cPrev">
      <span class="pvLabel">Current slide</span>
      <div class="pvBox" id="pvBox"></div>
      <div class="cNext" id="cNext"></div>
    </div>
    <div class="cNotes">
      <div class="nh">Presenter notes</div>
      <div class="nt" id="cNotes"></div>
    </div>
  </div>
  <div class="cBot">
    <span class="shareTip">← → arrows · space = next · Esc = end</span>
    <span>
      <button class="ghost" onclick="pPrev(event)">← Prev</button>
      <button onclick="pNext(event)">Next →</button>
      <button class="ghost" onclick="endPresent()">End session</button>
    </span>
  </div>
</div>

<script>
/* ---- QR generator (Kazuhiko Arase, MIT) — one copy, shared by every practice ---- */
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/

//  http://www.opensource.org/licenses/mit-license.php

// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html

//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);

      } else if (sense === "imagination") {
        B.push(b("Bring to mind a place where you feel at ease.", "Real or imagined — a memory, or made up. Somewhere you’d like to be."));
        B.push(b("Let your eyes be as they want."));
        B.push(b("Let the place take shape.", "Indoors or out? Day or night? Where are you in it?"));
        B.push(b("Look around — what do you see?", "Colors, light, what’s near and what’s far."));
        B.push(b("What do you hear there?", "Or is it quiet?"));
        B.push(b("What do you feel there?", "The air, the temperature, the ground beneath you."));
        B.push(b("How is your body breathing?", BREATH_NOTE_FULL));
      }
      if (v.skill !== "imagery") B.push(b("Imagine & Invite anything else you may be feeling right now."));
      if (sense === "touch") {
        B.push(b("Focus on your one thing."));
        B.push(b("Does it give you a sense of like or dislike?", "What about it do you like?"));
        B.push(b("What does it feel like on your skin?", "Does it feel different on different parts of your hand? Fingertips? Palm? Knuckles? Wrist?"));
      } else if (sense === "sight") {
        B.push(b("Notice what your eyes are drawn towards."));
        B.push(b("Does it give you a sense of like or dislike?", "What about it do you like?"));
        B.push(b("How do your eyes interact with it?", "Let your eyes take your attention where they want."));
      } else if (sense === "sound") {
        B.push(b("Choose what to anchor on.", "A group of sounds together, a sound that comes and goes, or a constant sound — whichever is easiest to stay with. Let that be your anchor."));
        B.push(b("Does it give you a sense of like or dislike?", "What about it do you like?"));
        B.push(b("How does it arrive to you?", "Steady or rhythmic? Close or distant? Does it pulse, or hold?"));
      } else if (sense === "movement") {
        B.push(b("Choose one movement to return to.", "Whichever felt best, or most available — let that be your anchor."));
        B.push(b("Does it give you a sense of like or dislike?", "What about it do you like?"));
        B.push(b("Make it bigger, smaller, or still.", "You’re the one in control of it — notice that."));
        B.push(b("What does the movement feel like in your body?", "Where do you feel it most? In the joint, the muscle, the whole limb?"));
      } else if (sense === "imagination") {
        B.push(b("Let one part of the place hold your attention.", "The detail or spot that feels best — let that be your anchor."));
        B.push(b("Does it give you a sense of like or dislike?", "What about it do you like?"));
        B.push(b("Notice you can shift it.", "Move closer, change the light, add or remove something — it’s yours."));
      }
      descBeats(P, "object", sense, v).forEach(x => B.push(x));
      B.push(b("As you mindfully experience it, how does it affect your breath?", "Chest or belly? Full or shallow? Tense or relaxed?"));
      B.push(b("As you mindfully experience it, how does it affect your posture?", "Upright or collapsed? Energized or relaxed?"));
      B.push(b("As you mindfully experience it, are you more or less likely to smile?", "Let yourself smile if so."));
      B.push(b("Do you feel more or less connection…?", "…to the present? To your senses? Your breath? Your inner experience? — Check your capacity."));
      B.push(b("What emotion word best fits your current safety experience?", "Calm? Still? Playful? Joy? Curious? — “Something like…”"));
      B.push(b("Notice how safety feels in your body generally.", "Mobile or immobile? Heavy or light?"));
      B.push(b("Notice how safety feels in your body specifically.", "Is there one place in your body where this emotion is even more obvious? Coming from, or going to? Common areas: face, chest, and belly."));
      B.push(b("How is your body breathing?", BREATH_NOTE_SHORT));
      if (v.descSafety !== false) descBeats(P, "safety", sense, v).forEach(x => B.push(x));
      if (o.rate) B.push(b("On a scale of 0–10, what is your current level of safety?"));
      return B;
    }
    const CURIOSITY = (P) => mkq(P)("Do you feel interest or curiosity about your non-safety internal experiences?", "You can say yes or no.");
  /* Segment the canonical ladder so a cohort can run it to a chosen depth.
     Safety Simplified teaches exactly this ladder one stage deeper each week:
     anchor (wk2) → witness (wk3) → experience (wk4). Boundaries are located by
     the ladder's own headlines, so they follow CB if CB ever changes. */
  function segments(sense, v){
    const all = ladderBeats("Practice", sense, {rate:false}, v);
    const at = t => all.findIndex(b => String(b.h||"").indexOf(t) === 0);
    const wStart = at("What emotion word best fits");
    const eStart = at("What color is your safety");
    return {
      anchor:     all.slice(0, wStart >= 0 ? wStart : all.length),
      witness:    wStart >= 0 ? all.slice(wStart, eStart >= 0 ? eStart : all.length) : [],
      experience: eStart >= 0 ? all.slice(eStart) : []
    };
  }

  /* ---- BATCH A: prompts that were living in both CB and SRS, character for
     character. Extracted verbatim from CB (the standard) so there is one copy.
     Justin, 2026-08-04: "A - yeah fix it." ---- */

  const OBSTACLE_STATEMENTS = [
    "“I’m capable of achieving my goals.”", "“I deserve to get unstuck.”", "“My feelings are a normal result of my life context.”", "“I am worthy of making change.”",
    "“My feelings are important.”", "“I have everything I need within me.”", "“I am worthy of acceptance.”", "“I am capable of creating positive change.”",
    "“I am enough as I am.”", "“I’m allowed to take up space.”", "“I deserve kindness.”", "“My needs matter.”",
    "“It’s okay to lower my defenses.”", "“I can trust myself.”", "“I’m allowed to feel safe.”", "“Things can get better for me.”"
  ];
  function pickObstacles(n){
    const a = OBSTACLE_STATEMENTS.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a.slice(0, n);
  }

  /* the body of the capacity-check slide — identical in every tool */
  const CAPACITY_H = "check your Capacity:";
  const CAPACITY_BODY =
    "1. Intolerable distress<br>2. Curiosity turns into evaluation<br>3. Losing connection with your breath<br>4. Intrusive cognitions" +
    "<br><br>Ask yourself:<br>– What do I need right now?<br>– Do I genuinely want to continue?<br>– Does my body genuinely want to continue?";

  /* Imagery & Invitation — Validate, Normalize, imagine it, invite it */
  function IMAGERY_TAIL(P){
    const b = mkq(P);
    return [
      b("What is one non-safety experience you can Validate?", "“I do feel _____.” / “I don’t like it, but I feel _____.” / “Yeah, fine, I feel _____.”"),
      b("Normalize that experience.", "“I feel _____, which makes sense based on my life context.”"),
      b("What does _____ look like?", "“_____ looks like _____.”"),
      b("Where is _____?"),
      b("What is _____ doing?"),
      b("Invite _____ to be with you while you reconnect with the external world.")
    ];
  }

  /* Obstacles — four statements, then Validate / Normalize / Imagine / Invite.
     `four` lets a cohort supply its own "4 statements." slide (SRS shows a body
     line there); everything after it is shared. */
  function OBSTACLES_TAIL(P, four){
    const b = mkq(P), B = [];
    B.push(four || b("4 statements.", "Check your capacity."));
    pickObstacles(4).forEach(s => B.push(b(s, "Notice what surfaces as you say it to yourself.")));
    B.push(b("Validate the Obstacle."));
    B.push(b("Normalize the Obstacle."));
    B.push(b("Imagine.", "What does it look like? Where is it? What is it doing?"));
    B.push(b("Invite the Obstacle to be with you while you reconnect with the external world."));
    return B;
  }

  /* THE CANONICAL CLOSING — every practice in every cohort ends this way.
     Justin, 2026-08-04: "CB, SRS, and SS should all use that closing structure."
     Structure is CB's; two lines are his edits ("(or stay just as you are)",
     "Give yourself kindness if you have it"); CB's "Let the practice settle as
     you come back" is cut; and SRS's warmer closing copy is folded into the
     presenter notes rather than lost. The capacity check is NOT included — each
     practice appends its own, because the break minutes differ per cohort. */
  function CLOSING(P){
    const b = mkq(P);
    return [
      b("Let your awareness begin to widen.", "No rush."),
      b("Reconnect to the external present moment.",
        "If your eyes are closed, let them open when they’re ready. — What do you see? What do you hear?"),
      b("Let your body move however feels good (or stay just as you are).",
        "Stretch, shift, settle. If you’ve been moving, keep going. — Push, pull, squeeze, wiggle, clench, roll, stand, stretch, hug… There’s no wrong way."),
      b("Take one intentional breath."),
      b("Give yourself kindness if you have it.",
        "You’ve earned it. Even a “good job, self” counts.")
    ];
  }
  return {ladderBeats:ladderBeats, CURIOSITY:CURIOSITY, mkq:mkq, segments:segments, CLOSING:CLOSING,
          OBSTACLE_STATEMENTS:OBSTACLE_STATEMENTS, pickObstacles:pickObstacles,
          CAPACITY_BODY:CAPACITY_BODY, CAPACITY_H:CAPACITY_H, IMAGERY_TAIL:IMAGERY_TAIL, OBSTACLES_TAIL:OBSTACLES_TAIL,
          BREATH_NOTE_FULL:BREATH_NOTE_FULL, BREATH_NOTE_SHORT:BREATH_NOTE_SHORT,
          HEAR_NOTE:HEAR_NOTE, DELEMS:['color','shape','temp','texture','doing']};
})();


/* ---------------- the shared cohort skeleton ---------------- */
/* ==================================================================
   THE COHORT SKELETON — how every multi-week live cohort opens and closes.
   Justin, 2026-08-04: "standardize these where you can."

   Self-Regulation Simplified and Safety Simplified were each writing their own
   copy of the same seven slides: cover · app check-in · ice-melter · homework
   review … app check-in again · homework · questions · next-week (or finale).
   A third cohort would have made a third copy. Now there is one.

   SRS had real presenter notes on these; SS had none. So SRS's notes are the
   canonical ones — a cohort supplies only what is genuinely its own (its ice-
   melter question, its homework, its week titles) and inherits the rest.

   The skeleton does NOT build beats itself. Each cohort passes its own
   constructors in `mk` ({cover, info, app}), so every beat keeps that module's
   exact shape and the merged builder stays beat-identical to before. What is
   shared is the SEQUENCE and the CANONICAL NOTES, which is the part that drifts.
   ================================================================== */
const COHORT = (function(){

  /* ---- canonical presenter notes (from SRS, the cohort that had them) ---- */
  const N = {
    checkinBefore:
      "Before we do anything, open the app and check in. — If you’re not in yet, scan the code on screen or type the join code. — Notice where you are right now. There’s no right answer. — Two reasons we do this. One, it gives you a starting point, so at the end you can see whether the practice moved anything. Two, over the cohort it becomes a picture of your baseline, which is the thing we’re actually trying to move. — Take your time.",
    checkinAfter:
      "Let’s check in one more time. — Open the app again and notice where you are now. Not better or worse, just what’s true. — Then look at where you started and where you are. Sometimes it moved. Sometimes it didn’t, and sometimes it went the other way. All three are real information, and none of them mean you did it wrong. — That comparison is the point. You’re building evidence about your own system.",
    homeworkReview:
      "Open floor, but keep it moving — a few voices, not everyone. — What I’m listening for: did you practice inside your safety environment AND outside it? What got in the way? — If someone says they didn’t practice, that’s useful information, not a confession. Ask what stopped them.",
    questions:
      "Take what’s in the room. If nothing comes, that’s fine — don’t fish. — Point anything big toward the cohort space so others can see the answer."
  };

  const CHECKIN_BEFORE_BODY = "open the stuck not broken app and check in before the practice.";
  const CHECKIN_AFTER_BODY  = "open the app and check in again.";

  /* ---- OPEN: cover · check in · ice-melter · homework review ----
     c = {n, title, eyebrow, coverNote, checkinBody, checkinNote,
          ice, iceNote, hwReviewH, hwReviewBody, hwReviewNote}
     mk = {cover(h,note,eyebrow), info(h,body,note), app(h,body,note,phase)} */
  function open(c, mk){
    const B = [];
    B.push(mk.cover("week "+c.n+".<br>"+c.title, c.coverNote || "", c.eyebrow));
    B.push(mk.app("check in.",
      c.checkinBody || CHECKIN_BEFORE_BODY,
      c.checkinNote || N.checkinBefore, "before"));
    B.push(mk.info("ice-melter.", c.ice, c.iceNote));
    if (c.n > 1) B.push(mk.info(
      c.hwReviewH || "how was the homework?",
      c.hwReviewBody || "",
      c.hwReviewNote || N.homeworkReview));
    return B;
  }

  /* ---- CLOSE: check in again · homework · [extras] · questions · next ----
     c = {n, last, checkinBody, checkinNote, homework, homeworkNote,
          extras (array of already-built beats), questionsNote,
          next:{n,title}, nextNote, finaleH, finaleNote, finaleEyebrow} */
  function close(c, mk){
    const B = [];
    B.push(mk.app("check in again.",
      c.checkinBody || CHECKIN_AFTER_BODY,
      c.checkinNote || N.checkinAfter, "after"));
    B.push(mk.info("homework.", c.homework, c.homeworkNote));
    (c.extras || []).forEach(b => B.push(b));
    B.push(mk.info("questions?", "", c.questionsNote || N.questions));
    if (!c.last && c.next) {
      B.push(mk.cover("next week:<br>"+c.next.title, c.nextNote || "", "WEEK "+c.next.n));
    } else {
      B.push(mk.cover(c.finaleH || "you did it. 🎉", c.finaleNote || "",
                      c.finaleEyebrow || "THANK YOU"));
    }
    return B;
  }

  return { open:open, close:close, NOTES:N,
           CHECKIN_BEFORE_BODY:CHECKIN_BEFORE_BODY, CHECKIN_AFTER_BODY:CHECKIN_AFTER_BODY };
})();

  }
  
  st.order.forEach(k=>{
    if(st.breathEach) B.push(word("breath",BREATH_NOTE));
    const s=SENSES[k];
    if(s) B.push(word(s.word,s.note));

  if(st.breathEach && st.order.length) B.push(word("breath",BREATH_NOTE));

    function chips(id, obj, get, set, invert) {
      const el = document.getElementById(id);
      el.innerHTML = "";
      Object.keys(obj).forEach(k => {
        const d = document.createElement("div");
        d.className = "opt" + (get() === k ? (invert ? " sel" : " check") : "");
        d.innerHTML = obj[k].label + (obj[k].draft ? ' <span class="dr">draft</span>' : "");
        d.onclick = () => {
          set(k);
          render();
        };
        el.appendChild(d);
      });
    }

    function tog(pr, key, label, extra) {
      return '<label class="toggle"><input type="checkbox" ' + (st[pr][key] ? "checked" : "") +
        ' onchange="st.' + pr + '.' + key + '=this.checked;render()"> ' + label + (extra ? ' <span class="dr">' + extra + '</span>' : "") + '</label>';
    }

    function miniChips(pr, key, vals, label, suffix) {
      let h = '<div class="mini"><span>' + label + '</span>';
      vals.forEach(x => {
        h += '<span class="mopt' + (st[pr][key] === x ? " sel" : "") + '" onclick="st.' + pr + '.' + key + '=' + x + ';render()">' + x + (suffix || "") + '</span>';
      });
      return h + '</div>';
    }

        h += '<span class="opt' + (on ? ' check' : '') + '" style="padding:4px 9px;font-size:12px" onclick="toggleDelem(\'' + pr + '\',\'' + k + '\')">' + DESC_LABELS[k] + '</span>';
      });
      h += '<span class="opt" style="padding:4px 9px;font-size:12px" onclick="randomizeDelems(\'' + pr + '\')">🎲</span></div>';
      return h;
    }

    function toggleDelem(pr, k) {
      const a = st[pr].delems,
        i = a.indexOf(k);
      if (i >= 0) a.splice(i, 1);
      else a.push(k);
      render();
    }

    function randomizeDelems(pr) {
      const keys = Object.keys(DESC_LABELS);
      for (let i = keys.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [keys[i], keys[j]] = [keys[j], keys[i]];
      }
      st[pr].delems = keys.slice(0, 2 + Math.floor(Math.random() * (keys.length - 1)));
      render();

  "<br><br>Ask yourself:<br>– What do I need right now?<br>– Do I genuinely want to continue?<br>– Does my body genuinely want to continue?";
function capacityCheck(breakMin,note){

   (Justin, 2026-08-04), so this delegates to the canonical LADDER and the 61

   week's shape onto CB's parameters. */
const WEEK_SKILL={none:"anchoring",vn:"anchoring",ii:"imagery",obs:"obstacles",
                  bal:"balancing",pend:"pendulating",baldesc:"balancing",penddesc:"pendulating"};
const SKILL_RATE={anchoring:true,imagery:true,obstacles:true,balancing:true,pendulating:false};
function ladder(sense, o){
  const skill = WEEK_SKILL[o.tail] || "anchoring";
  const B = LADDER.ladderBeats("Practice", sense,
    {rate: !!SKILL_RATE[skill]},
    {skill: (o.iiSweep ? skill : "imagery"), descSafety:true, descOn:false, delems:LADDER.DELEMS});
  if(o.interest) B.push(LADDER.CURIOSITY("Practice"));
  return B;
}

    B.push(q("Is it okay for this non-safety experience to be here with you?","You can say yes or no."));
    B.push(q("Notice how that feels in your body overall."));
    B.push(q("Notice how that feels in your body specifically."));
    B.push(q("How is your body breathing?",CAP_NOTE));
    B.push(q("Bring your attention back to the safety experience."));
    B.push(q("Has safety changed?"));

/* ---------- ONE FULL PRACTICE ---------- */
function practiceBeats(w, label){
  const B=[];
  const o = { iiSweep: w.n>=5, interest: w.n>=3, tail: w.tail };
  B.push(ptitle(label, w.short.toUpperCase()+"<br>ANCHOR: "+SENSES[st.sense].label.toUpperCase(),
    "We will: "+w.we+" — Say it out loud so they know the shape of the next twenty minutes. Then stop talking.",
    "We will "+w.we));
  B.push(capacityCheck(0));
  ladder(st.sense,o).forEach(b=>B.push(b));
  tailBeats(w.tail).forEach(b=>B.push(b));
  reconnect().forEach(b=>B.push(b));
  return B;
}

/* ==================================================================
   FULL SESSION
   ================================================================== */
const TABS={open:"Open",vignette:"Vignette",practice:"Practice",close:"Close"};

function buildBeats(){
  const w=W(); let B=[];
  const sec=(name,from)=>{for(let i=from;i<B.length;i++) if(!B[i].section) B[i].section=name;};

  /* ---------- OPEN ---------- */
  /* structure + the generic presenter notes come from the shared COHORT skeleton */
  let m=0;
  COHORT.open({
    n:w.n, title:w.title, eyebrow:"SELF-REGULATION SIMPLIFIED",
    coverNote:"Welcome back. — Week "+w.n+" of eight. Today is "+w.short+". — Quick reminder of how this room works: the lessons live in the Academy, and you review them on your own time. In here we practice. That’s it. — No pressure to participate out loud. Cameras on or off. Chat if you want it.",
    ice:w.ice, iceNote:w.iceNote
  }, MK).forEach(b=>B.push(b));

  sec("open",m);

  /* ---------- VIGNETTE ---------- */
  m=B.length;
  w.vig.forEach(v=>B.push(vig(v.h,v.body,v.note,v.who,v.state)));
  if(w.vigQ) B.push(q(w.vigQ.h,w.vigQ.note));
  /* the teaching beats are deliberately thin — pre-work carries the load */
  (w.teach||[]).forEach(t=>B.push(info(t.h,t.body,t.note,t.img)));
  sec("vignette",m);

  /* ---------- PRACTICE ---------- */
  /* every practice ends the same way: reconnect → break (timed) → share-out */
  m=B.length;
  const BMIN = BREAK_MIN[w.tail] || 3;
  practiceBeats(w,"Practice 1").forEach(b=>B.push(b));
  B.push(capacityCheck(BMIN,
    "Capacity check, then break. Read the four, ask the three, then give them the "+BMIN+" minutes and actually stop talking. — Leave your camera on or off, nobody needs to perform a break. — The countdown is on the slide so nobody has to watch me for the cue."));
  B.push(reflectOne());
  B.push(q(REFLECT_WEEK[w.n],REFLECT_NOTE));
  B.push(info("what was that like?","",
    "Open mics. Let the silence sit for a few seconds before you fill it — people need a moment to come back into words. — You are not teaching here. Reflect, normalize, and let members respond to each other. If two members start talking to each other, stay out of it — that’s the co-regulation doing its job."));
  {
    practiceBeats(w,"Practice 2").forEach(b=>B.push(b));
    B.push(capacityCheck(BMIN));
    B.push(reflectOne());
    B.push(q("was the second one different?","Not better. Different. What changed? — This is the comparative rep, and it feeds the share-out that follows."));
    B.push(info("and that one?","",
      "Shorter share this time. — Worth asking: was the second one different from the first? Usually it is, and hearing that from each other is more convincing than hearing it from me."));
  }
  sec("practice",m);

  /* ---------- CLOSE ---------- */
  m=B.length;
  COHORT.close({
    n:w.n, last:w.n>=8,
    homework:"1. Use the practices at least once <b>inside</b> your Passive Safety Environment.<br><br>"+
             "2. Use the practices at least once <b>outside</b> it.<br><br>"+
             "3. Share your experiences in the cohort space.",
    homeworkNote:"Same three every week. Inside your safety environment, outside it, and tell us about it. — The “outside” one is the one people skip, and it’s the one that generalizes the skill.",
    extras:[ app("your practice this week.",
      w.appHow+"<br><br>And check in daily — even on the days you don’t practice.",
      "The app will run this week’s skill for you, guided, whenever you want it. That’s your “inside the safety environment” rep, handled. — Check in daily even when you don’t practice. Especially then. The days you don’t practice are data too. — By week eight you’ll have two months of your own pattern to look at.") ],
    next: w.n<8 ? {n:WEEKS[w.n].n, title:WEEKS[w.n].title} : null,
    nextNote: w.n<8 ? ("Next Thursday we do "+WEEKS[w.n].short+". — Review the lesson beforehand if you want it — and if you don’t get to it, come anyway. The practice is the part that matters.") : "",
    finaleNote:"Eight weeks. — Look at what you can do now that you couldn’t in August. You can anchor. You can validate and normalize. You can invite a hard feeling to stay. You can balance it, pendulate it, and describe it. — And you can stop when you’ve had enough, which might be the biggest one. — This doesn’t end here — it just stops being a cohort and starts being a practice. The app has all of it. The Academy has all of us."
  }, MK).forEach(b=>B.push(b));

  sec("close",m);

  return B;
}

    el.appendChild(d);
  });

/* one roll changes both the anchor and the backdrop, so a repeat week never

  render();
}

/* The CANONICAL closing, shared with CB and SRS (Justin, 2026-08-04). */
const RECONNECT = () => LADDER.CLOSING("Practice");

/* a practice = the canonical ladder to a depth, with Validate/Normalize inserted
   between the anchor and the witness stages, exactly as the deck orders it */
function practiceBeats(pr){
  const B=[];
  B.push(ptitle(pr.label, "SAFETY SIMPLIFIED<br>ANCHOR: "+SENSES[st.sense].label.toUpperCase()));
  const seg = LADDER.segments(st.sense,
    {skill:"imagery", descSafety:true, descOn:false, delems:LADDER.DELEMS});
  seg.anchor.forEach(b=>B.push(b));
  (pr.tail||[]).forEach(([h,n])=>B.push(q(h,n)));
  if(pr.vn){ B.push(q("Validate that experience.",V_NOTE)); B.push(q("Normalize that experience.",N_NOTE)); }
  if(pr.depth==="witness"||pr.depth==="experience") seg.witness.forEach(b=>B.push(b));
  if(pr.depth==="experience") seg.experience.forEach(b=>B.push(b));
  RECONNECT().forEach(b=>B.push(b));
  B.push(info("well done. 🥳","How was this practice?<br>What was your experience?<br>What emotions came up?",""));
  return B;
}

const TABS={open:"Open",teach:"Teach",practice:"Practice",close:"Close"};

function buildBeats(){
  const w=W(); const B=[];
  const sec=(name,from)=>{for(let i=from;i<B.length;i++) if(!B[i].section) B[i].section=name;};

  let m=0;
  COHORT.open({

    hwReviewBody:"How was the meditation practice?<br><br>Has your Passive Safety Environment changed? Have you made any adjustments?"
  }, MK).forEach(b=>B.push(b));

  sec("open",m);

  m=B.length;
  (w.teach||[]).forEach(t=>B.push(info(t.h,t.body,"",null,t.img)));
  (w.intro||[]).forEach(v=>B.push(vig(v.h,v.body)));
  sec("teach",m);

  /* ---- practice ---- */
  m=B.length;
  /* week 1: three items, each following one of Jenny's */
  if((w.items||[]).length){
    B.push(ptitle("Three items","SAFETY SIMPLIFIED<br>LIKE / DISLIKE"));
    B.push(info("bring three items.","Find three things from around your home and bring them here.<br><br>We'll take them one at a time. Jenny goes first each time.",""));
    w.items.forEach(it=>{
      it.jenny.forEach(j=>B.push(vig(j.h,j.body,j.img)));
      B.push(q(it.n+" item: does it give you a<br>sense of like or dislike?","What about it do you like? What about it do you dislike?"));
      B.push(q(it.n+" item: how can you tell?","Pushed toward? Pulled away? — Breath? Muscles? Smile? Thoughts? Emotions? — Less obvious: sensations, impulses."));
    });
    (w.after||[]).forEach(t=>B.push(info(t.h,t.body,"",null,t.img)));
    (w.outro||[]).forEach(v=>B.push(vig(v.h,v.body)));
  }
  (w.practices||[]).forEach(pr=>{ practiceBeats(pr).forEach(b=>B.push(b)); });
  sec("practice",m);

  m=B.length;
  COHORT.close({
    n:w.n, last:w.n>=4,
    homework:w.homework,
    next: w.n<4 ? {n:WEEKS[w.n].n, title:WEEKS[w.n].title} : null
  }, MK).forEach(b=>B.push(b));

  sec("close",m);
  return B;
}

/* ---------------- one slide renderer + slide list (shared) ---------------- */
/* ==================================================================
   ONE SLIDE RENDERER for every practice.
   Each practice module keeps its own beats (its curriculum), and declares a
   map(beat) that translates its native beat into the canonical shape below.
   Nothing about a practice's content changes; only how it is drawn.

   canonical shapes
     cover   {eyebrow, h, flow?}          big statement, logo
     ptitle  {eyebrow, h, body?}          practice title
     prompt  {h}                          the practice line, veiled
     info    {eyebrow?, h, body, breakMin?}
     story   {eyebrow, h, body}           a vignette reading slide
     checkin {eyebrow, h, body}           app check-in, logo
     events  {eyebrow, h, rows}           the closing invitation
   ================================================================== */
const FOOT = '<div class="foot">'+
  '<img class="logo" src="https://static.wixstatic.com/media/2d354d_af56ea98dfab423d908b57ed57a01937~mv2.png" alt="Unstucking Academy">'+
  '<span class="byline">JUSTIN SUNSERI, STUCKNOTBROKEN.COM</span></div>';

function eyebrowHTML(t){ return '<div class="eyebrow">'+(t||"")+'</div>'; }
/* IMAGE WELL — the AAMFT mechanism, browser-native. A slide that declares
   img:"<marker>" renders a right panel filled from images/<marker>.jpg (then
   .png). Drop the file next to index.html and the well fills on the next
   load — no code change. No file → the well removes itself and the text
   takes the full grid again. Title slides carry no wells by design. */
function wellHTML(m){
  if(!m) return "";
  return '<div class="well"><img src="images/'+m+'.jpg" alt="" '+
    'onerror="if(!this.dataset.p){this.dataset.p=1;this.src=this.src.replace(/\.jpg$/,\'.png\');}'+
    'else{var s=this.closest(\'.s\');if(s)s.classList.remove(\'haswell\');this.parentNode.remove();}"></div>';
}
function breakClockHTML(min){
  if(!min) return "";
  return '<div class="breakclock"><span class="bl">break</span>'+
    '<span class="bt" data-secs="'+(min*60)+'">'+min+':00</span></div>';
}

function renderSlide(c){
  if(!c) return "";
  const eb = eyebrowHTML(c.eyebrow);
  switch(c.kind){
    case "prompt":
      return '<div class="s prompt"><div class="p">'+(c.h||"")+'</div></div>';
    case "cover":
      return '<div class="s cover">'+eb+'<h1>'+(c.h||"")+'</h1>'+(c.flow||"")+FOOT+'</div>';
    case "ptitle":
      return '<div class="s ptitle">'+eb+'<h1>'+(c.h||"")+'</h1>'+
        (c.body?'<div class="body">'+c.body+'</div>':"")+FOOT+'</div>';
    case "checkin":
      return '<div class="s checkin">'+eb+'<h1>'+(c.h||"")+'</h1>'+
        (c.body?'<div class="body">'+c.body+'</div>':"")+FOOT+'</div>';
    case "story": {
      /* long vignettes shrink to fit the frame instead of clipping; a portrait
         well counts as extra length since it narrows the text column */
      const blen = String(c.body||"").replace(/<[^>]+>/g,"").length + (c.img?250:0);
      const fit = blen>1350 ? " x3" : blen>900 ? " x2" : (blen>550 ? " x1" : "");
      return '<div class="s story'+(c.img?' haswell':'')+fit+'">'+eb+'<h1>'+(c.h||"")+'</h1>'+
        (c.body?'<div class="body">'+c.body+'</div>':"")+wellHTML(c.img)+'</div>';
    }
    case "events":
      return '<div class="s events">'+eb+'<h1>'+(c.h||"")+'</h1>'+(c.rows||"")+FOOT+'</div>';
    case "info":
    default:
      return '<div class="s info'+(c.img?' haswell':'')+'">'+eb+'<h1>'+(c.h||"")+'</h1>'+
        (c.body?'<div class="body">'+c.body+'</div>':"")+wellHTML(c.img)+breakClockHTML(c.breakMin)+'</div>';
  }
}

/* the builder's slide list — also one implementation for every practice */
function slidesHTML(beats, practice){
  let html="";
  beats.forEach(b=>{
    const c = practice.map(b) || {};
    const head = String(c.h||"").replace(/<br>/g," ");
    const meta = [c.kind, (b.fixed?"fixed":"varies with dials")]
      .concat(c.eyebrow?[String(c.eyebrow).replace(/<br>/g," / ")]:[]).join(" · ");
    html += '<div class="slide'+(b.fixed?" fixedc":"")+'">'+
      '<div class="tag">'+meta+'</div>'+
      '<p class="stu">'+head+'</p>'+
      (c.body?'<p class="bod">'+String(c.body).replace(/<br>/g," · ")+'</p>':"")+
      (b.note?'<p class="note"><b>presenter notes</b> &nbsp;'+b.note+'</p>'
             :'<p class="note" style="color:var(--muted)">— (lots of quiet) —</p>')+
      '</div>';
  });
  return html;
}
